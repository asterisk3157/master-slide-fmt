<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} — コメント</title>
<!-- review.py の窓．左に資料（iframe．review_overlay.js を差し込んである），右にコメントの欄 -->
<style>
  :root { --bg: #f4f5f7; --panel: #ffffff; --line: #d9dce1; --text: #1f2328; --sub: #59636e; --accent: #1f6feb;
          --draft: #9a6700; --sent: #1f6feb; --work: #8250df; --ai: #1a7f37; --done: #8c959f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.55 -apple-system, 'Hiragino Sans', 'Segoe UI', sans-serif; }
  body { display: grid; grid-template-columns: 1fr 380px; }
  iframe { width: 100%; height: 100%; border: 0; background: #2f3b52; }
  aside { display: flex; flex-direction: column; height: 100%; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  header { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 2px; font-size: 15px; }
  #status { font-size: 12px; color: var(--sub); }
  #status.off { color: #cf222e; }
  .bar { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: #f6f8fa; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  button.link { border: 0; background: none; padding: 2px 4px; color: var(--accent); }
  #compose { display: none; padding: 12px 14px; border-bottom: 1px solid var(--line); background: #f0f6ff; }
  #compose.on { display: block; }
  .where { font-size: 12px; color: var(--sub); }
  blockquote { margin: 6px 0; padding: 4px 8px; border-left: 3px solid #e3b341; background: #fff8e1; font-size: 13px; max-height: 5.5em; overflow: auto; }
  textarea { width: 100%; min-height: 72px; resize: vertical; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .hint { font-size: 11px; color: var(--sub); }
  #list { flex: 1; overflow: auto; padding: 8px 10px 40px; }
  .empty { color: var(--sub); padding: 18px 6px; font-size: 13px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin: 8px 0; background: #fff; }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(31,111,235,.15); }
  .card.resolved { opacity: .6; }
  .head { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; cursor: pointer; }
  .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; color: #fff; white-space: nowrap; }
  .tag.draft { background: var(--draft); } .tag.sent { background: var(--sent); } .tag.work { background: var(--work); }
  .tag.ai { background: var(--ai); } .tag.done { background: var(--done); }
  .msg { margin: 6px 0 0; padding: 6px 8px; border-radius: 6px; background: #f6f8fa; white-space: pre-wrap; word-break: break-word; }
  .msg.ai { background: #eef8f0; border-left: 3px solid var(--ai); }
  .msg .who { display: block; font-size: 11px; color: var(--sub); }
  .acts { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .rep { margin-top: 6px; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #24292f; color: #fff; padding: 7px 14px;
           border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.on { opacity: .92; }
  label.chk { font-size: 12px; color: var(--sub); display: inline-flex; gap: 4px; align-items: center; }
</style>
</head>
<body>
<iframe id="deck" src="/deck/{{NAME}}.html"></iframe>
<aside>
  <header>
    <h1>{{NAME}}</h1>
    <div id="status">つないでいる…</div>
    <div class="bar">
      <button id="sendAll" class="primary" disabled>下書きを送信</button>
      <button id="copy" title="AI に届かないときは，これでコピーしてチャットに貼る">コピーして貼る</button>
      <label class="chk"><input type="checkbox" id="hideDone">解決済みを隠す</label>
    </div>
  </header>
  <div id="compose">
    <div class="where" id="cWhere"></div>
    <blockquote id="cQuote"></blockquote>
    <textarea id="cText" placeholder="コメント（⌘/Ctrl + Enter で送信）"></textarea>
    <div class="bar">
      <button id="cSend" class="primary">送信</button>
      <button id="cDraft">下書きに置く</button>
      <button id="cCancel">やめる</button>
    </div>
    <div class="hint">「下書きに置く」でいくつか書きためて，上の「下書きを送信」でまとめて送れる</div>
  </div>
  <div id="list"></div>
</aside>
<div id="toast"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const frame = $('deck');
  let threads = [], version = 0, active = null, pick = null, pos = null;
  const KEY = 'msf-review-pos-{{NAME}}';
  try { pos = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) {}

  const api = (path, body) => fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
    .then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(t); }));
  const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); };
  const toDeck = m => frame.contentWindow && frame.contentWindow.postMessage(Object.assign({ from: 'msf-review-shell' }, m), '*');
  const sendThreads = () => toDeck({ type: 'threads', threads: threads.map(t => ({ id: t.id, slide: t.slide, index: t.index, quote: t.quote, state: t.state })), active });

  // スレッドの今の段階
  function stage(t) {
    if (t.state === 'resolved') return ['done', '解決'];
    const last = t.messages[t.messages.length - 1];
    if (!last) return ['done', ''];
    if (last.who === 'ai') return ['ai', 'AI の返信あり'];
    if (last.status === 'draft') return ['draft', '下書き'];
    if (last.status === 'sent') return ['sent', '送信済み（AI 待ち）'];
    return ['work', 'AI が対応中'];
  }

  function render() {
    const list = $('list'); list.textContent = '';
    const show = threads.filter(t => !$('hideDone').checked || t.state !== 'resolved')
                        .sort((a, b) => (a.index - b.index) || (a.id.localeCompare(b.id, undefined, { numeric: true })));
    const drafts = threads.reduce((n, t) => n + t.messages.filter(m => m.who === 'user' && m.status === 'draft').length, 0);
    $('sendAll').disabled = !drafts;
    $('sendAll').textContent = drafts ? `下書きを送信（${drafts}）` : '下書きを送信';
    if (!show.length) {
      const e = document.createElement('div'); e.className = 'empty';
      e.textContent = '資料の文を選んで「コメント」，または枚の右上の「この枚にコメント」から書く。';
      list.appendChild(e); return;
    }
    for (const t of show) {
      const [cls, label] = stage(t);
      const c = document.createElement('div');
      c.className = 'card' + (t.state === 'resolved' ? ' resolved' : '') + (t.id === active ? ' active' : '');
      const h = document.createElement('div'); h.className = 'head';
      const w = document.createElement('span'); w.className = 'where';
      w.textContent = `${t.id}　${t.index} 枚目` + (t.title ? `「${t.title}」` : '');
      const g = document.createElement('span'); g.className = 'tag ' + cls; g.textContent = label;
      h.append(w, g);
      h.onclick = () => { active = t.id; render(); toDeck({ type: 'goto', slide: t.slide, index: t.index, active }); };
      c.appendChild(h);
      if (t.quote) { const q = document.createElement('blockquote'); q.textContent = t.quote; c.appendChild(q); }
      t.messages.forEach((m, i) => {
        const d = document.createElement('div'); d.className = 'msg' + (m.who === 'ai' ? ' ai' : '');
        const who = document.createElement('span'); who.className = 'who';
        who.textContent = (m.who === 'ai' ? 'AI' : 'あなた') + (m.status === 'draft' ? '（下書き）' : '') + '　' + (m.at || '').slice(5, 16).replace('T', ' ');
        d.append(who, document.createTextNode(m.text));
        if (m.status === 'draft') {
          const del = document.createElement('button'); del.className = 'link'; del.textContent = '消す';
          del.onclick = () => api('/__review/edit', { id: t.id, msg: i, text: '' }).then(load);
          d.appendChild(del);
        }
        c.appendChild(d);
      });
      const acts = document.createElement('div'); acts.className = 'acts';
      const rep = document.createElement('button'); rep.textContent = '続けて書く';
      const res = document.createElement('button');
      res.textContent = t.state === 'resolved' ? '開き直す' : '解決にする';
      res.onclick = () => api('/__review/state', { id: t.id, state: t.state === 'resolved' ? 'open' : 'resolved' }).then(load);
      acts.append(rep, res); c.appendChild(acts);
      rep.onclick = () => {
        if (c.querySelector('.rep')) return;
        const box = document.createElement('div'); box.className = 'rep';
        const ta = document.createElement('textarea'); ta.placeholder = '続けて書く（⌘/Ctrl + Enter で送信）';
        const bar = document.createElement('div'); bar.className = 'bar';
        const s = document.createElement('button'); s.className = 'primary'; s.textContent = '送信';
        const dr = document.createElement('button'); dr.textContent = '下書きに置く';
        const go = send => { if (!ta.value.trim()) return; api('/__review/reply', { id: t.id, text: ta.value.trim(), send }).then(() => { toast(send ? '送信した' : '下書きに置いた'); load(); }); };
        s.onclick = () => go(true); dr.onclick = () => go(false);
        ta.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) go(true); };
        bar.append(s, dr); box.append(ta, bar); c.appendChild(box); ta.focus();
      };
      list.appendChild(c);
    }
  }

  function load() {
    return api('/__review/state').then(s => {
      threads = s.threads;
      if (version && s.version !== version) reloadDeck();
      version = s.version;
      render(); sendThreads();
    });
  }

  function reloadDeck() {
    if (pos) sessionStorage.setItem(KEY, JSON.stringify(pos));
    frame.contentWindow.location.reload();
    toast('資料を読み直した ' + new Date().toLocaleTimeString().slice(0, 5));
  }

  // 書く
  function compose(p) {
    pick = p;
    $('cWhere').textContent = `${p.index} 枚目` + (p.title ? `「${p.title}」` : '') + (p.quote ? '' : '（枚ごと）');
    $('cQuote').textContent = p.quote; $('cQuote').style.display = p.quote ? '' : 'none';
    $('compose').classList.add('on'); $('cText').value = ''; $('cText').focus();
  }
  function submit(send) {
    const text = $('cText').value.trim();
    if (!pick || !text) return;
    api('/__review/new', Object.assign({}, pick, { text, send })).then(r => {
      active = r.id; $('compose').classList.remove('on'); pick = null;
      toast(send ? '送信した' : '下書きに置いた'); load();
    });
  }
  $('cSend').onclick = () => submit(true);
  $('cDraft').onclick = () => submit(false);
  $('cCancel').onclick = () => { $('compose').classList.remove('on'); pick = null; };
  $('cText').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submit(true); if (e.key === 'Escape') $('cCancel').onclick(); };
  $('sendAll').onclick = () => api('/__review/send', {}).then(() => { toast('下書きを送信した'); load(); });
  $('hideDone').onchange = render;
  $('copy').onclick = () => api('/__review/copy', {}).then(r => {
    if (!r.text) { toast('送るコメントが無い'); return; }
    navigator.clipboard.writeText(r.text).then(() => toast('コピーした．チャットに貼る'), () => { prompt('コピーしてチャットに貼る', r.text); });
    load();
  });

  // 資料（iframe）からの知らせ
  addEventListener('message', e => {
    const m = e.data || {};
    if (m.from !== 'msf-review') return;
    if (m.type === 'compose') compose(m);
    if (m.type === 'scroll') { pos = m; try { sessionStorage.setItem(KEY, JSON.stringify(m)); } catch (x) {} }
    if (m.type === 'ready') { if (pos) toDeck(Object.assign({ type: 'restore' }, pos)); sendThreads(); }
  });

  // サーバーからの知らせ（資料が build された / コメントが変わった）
  function connect() {
    const es = new EventSource('/__review/events');
    es.onopen = () => { $('status').textContent = 'つながっている．build すると自動で読み直す'; $('status').className = ''; };
    es.addEventListener('html', () => load().then(() => {}));
    es.addEventListener('comments', () => load());
    es.onerror = () => { $('status').textContent = 'サーバーとつながっていない（review.py open で開き直す）'; $('status').className = 'off'; };
  }
  load().then(connect);
})();
</script>
</body>
</html>
